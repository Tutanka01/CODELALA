# LoRA fine-tuning v2 with OVH's official script (ovhai_llm_sft_tutorial/sft/sft_lora.py)
# on data/v2: verified single-file web apps (AdhyanshVerma/html-css-js-cot, GPL-3.0),
# a subset of the filtered CodeFeedback set (Apache-2.0) and a small FR/EN anchor.
model_path: models/olala-hf
output_dir: runs/v2

train_files:
  - data/v2/train.jsonl
eval_files:
  - data/v2/eval.jsonl

max_length: 8192
overlong: drop
max_eval_samples: 30
merge_when_done: true

lora:
  r: 32
  alpha: 64
  dropout: 0.05

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  warmup_steps: 10
  logging_steps: 2
  eval_strategy: steps
  eval_steps: 50
  per_device_eval_batch_size: 1
  save_steps: 25
  dataloader_num_workers: 0
  report_to: []
